<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1210" viewBox="0 0 1520 1210"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="1520" height="1210" fill="white"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#17212f}.small{font-size:15px}.body{font-size:17px}.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}</style><text x="40" y="52" class="title">GRAY / 조사·분석 하네스</text><text x="40" y="83" class="body">로컬 단일 사용자 데모 · 구현 전 설계안 · 2026.11.27</text><text x="40" y="135" class="title">01  시스템 아키텍처</text><rect x="40" y="180" width="260" height="135" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="58" y="211" class="label">로컬 브라우저</text><text x="58" y="241" class="small">기사 입력 → 분석 맡기기</text><text x="58" y="265" class="small">내 기록에서 단계·결과 확인</text><text x="58" y="289" class="small">기존 결과 카드 재사용</text><rect x="370" y="180" width="270" height="135" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="388" y="211" class="label">Python HTTP API</text><text x="388" y="241" class="small">검증 · 접수 ID 즉시 반환</text><text x="388" y="265" class="small">작업 조회 / 취소 / 재개</text><text x="388" y="289" class="small">127.0.0.1 바인딩</text><rect x="710" y="180" width="330" height="135" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="728" y="211" class="label">SQLite / 로컬 기록</text><text x="728" y="241" class="small">작업 · 체크포인트 · 문서</text><text x="728" y="265" class="small">인용 근거 · 검토 · 최종 결과</text><text x="728" y="289" class="small">DB와 .env는 HTTP / Git 제외</text><path d="M300 245 L370 245" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M640 245 L710 245" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="710" y="380" width="330" height="160" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="728" y="411" class="label">단일 워커 + 하네스</text><text x="728" y="441" class="small">대기 작업 1개씩 선점</text><text x="728" y="465" class="small">단계 실행 · 호출 예산 · 검증</text><text x="728" y="489" class="small">단계마다 결과 저장</text><text x="728" y="513" class="small">중단 후 마지막 성공 단계에서 재개</text><path d="M875 315 L875 380" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><text x="837.0" y="337.5" class="small">작업 선점</text><rect x="1120" y="340" width="350" height="100" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1138" y="371" class="label">K-EXAONE API</text><text x="1138" y="401" class="small">계획 → 분석 → 검토</text><text x="1138" y="425" class="small">필요한 쟁점만 보완</text><rect x="1120" y="480" width="350" height="100" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1138" y="511" class="label">Tavily API</text><text x="1138" y="541" class="small">검색 · 원문 추출</text><text x="1138" y="565" class="small">LLM이 생성한 URL은 채택 안 함</text><path d="M1040 420 L1120 390" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M1040 480 L1120 530" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="40" y="380" width="600" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="58" y="411" class="label">맡겨두고 돌아오는 흐름</text><text x="58" y="441" class="small">브라우저를 닫아도 로컬 서버가 켜져 있으면 계속 진행</text><text x="58" y="465" class="small">서버 종료 후 진행 작업은 중단됨으로 표시 → 사용자 재개</text><text x="58" y="489" class="small">기존 브라우저 저장 결과는 삭제하지 않고 함께 표시</text><text x="58" y="513" class="small">로컬 UI·DB + 외부 EXAONE / Tavily 호출</text><text x="40" y="640" class="title">02  조사·분석 실행 흐름</text><rect x="40" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="58" y="706" class="label">0  원문 확보</text><text x="58" y="736" class="small">URL 또는 본문</text><text x="58" y="760" class="small">원문·해시 저장</text><path d="M224 738 L244 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="247" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="265" y="706" class="label">1  조사 계획</text><text x="265" y="736" class="small">쟁점 최대 2개</text><text x="265" y="760" class="small">무엇을 찾을지 결정</text><path d="M431 738 L451 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="454" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="472" y="706" class="label">2  자료 수집</text><text x="472" y="736" class="small">사건·시점·주체 확인</text><text x="472" y="760" class="small">관련 문서 선별</text><path d="M638 738 L658 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="661" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="679" y="706" class="label">3  관점 초안</text><text x="679" y="736" class="small">주장 ↔ 구절 ↔ 출처</text><text x="679" y="760" class="small">실제 근거 ID 연결</text><path d="M845 738 L865 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="868" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="886" y="706" class="label">4  근거 검토</text><text x="886" y="736" class="small">문맥·과장·시점 검토</text><text x="886" y="760" class="small">Python 구절 검사</text><path d="M1052 738 L1072 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="1075" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1093" y="706" class="label">5  조건부 보완</text><text x="1093" y="736" class="small">빠진 근거만 재조사</text><text x="1093" y="760" class="small">추가 조사 1단계 제한</text><path d="M1259 738 L1279 738" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="1282" y="675" width="184" height="127" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1300" y="706" class="label">6  저장·열람</text><text x="1300" y="736" class="small">검증된 결과만 조립</text><text x="1300" y="760" class="small">내 기록에서 다시 열기</text><text x="40" y="840" class="body">기본 LLM 3회: 계획 · 초안 · 검토  /  보완은 조건부 1회  /  속도보다 근거 연결과 복구 가능한 실행에 초점</text><text x="40" y="900" class="title">03  검증 게이트와 실행 상한</text><rect x="40" y="930" width="460" height="180" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="58" y="961" class="label">통과해야 화면에 표시</text><text x="58" y="991" class="small">코드: 문서 ID·인용 구절 존재 확인</text><text x="58" y="1015" class="small">LLM: 구절이 해당 주장을 지지하는지 검토</text><text x="58" y="1039" class="small">자료 부족은 공개 · 찬반을 강제로 만들지 않음</text><text x="58" y="1063" class="small">같은 모델의 검토는 진실 판정이 아님</text><rect x="530" y="930" width="460" height="180" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="548" y="961" class="label">반복을 막는 예산</text><text x="548" y="991" class="small">동시 작업 1개 · 대기 최대 10개</text><text x="548" y="1015" class="small">검색 기본 4회 + 보완 2회</text><text x="548" y="1039" class="small">문서 8개 · 외부 추출 6개</text><text x="548" y="1063" class="small">재시도 포함 LLM HTTP 최대 6회</text><rect x="1020" y="930" width="450" height="180" rx="10" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1038" y="961" class="label">실패와 재개</text><text x="1038" y="991" class="small">작업 경과 상한 15분 · LLM 요청 180초</text><text x="1038" y="1015" class="small">성공 단계는 재사용 · 실패 단계부터 재개</text><text x="1038" y="1039" class="small">취소 후 추가 호출 / 결과 반영 차단</text><text x="1038" y="1063" class="small">API 호출 중 종료 시 중복 호출 가능</text><text x="40" y="1160" class="small">상세 계약·프롬프트 역할·DB·API·보완 조건·수용 검증은 함께 제공한 설계서와 구현 계획 참조.</text></svg>