.overlay{position:fixed;inset:0;background:#191f2866;z-index:3}.drawer{position:fixed;left:0;top:0;bottom:0;z-index:4;background:#fff;width:min(310px,85vw);padding:28px 24px;box-shadow:8px 0 40px #191f2812}.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.drawer button{border:0;background:none;color:var(--ink)}.drawer nav button{display:block;width:100%;text-align:left;padding:17px 14px;font-weight:650;font-size:15px;border-radius:5px}.drawer nav button:hover{background:#f2f6fc;color:var(--blue)}.drawer p{margin-top:28px;font-size:12px;color:#8b95a1}
@media(min-width:760px){.shell{margin:24px auto 0;border-radius:10px 10px 0 0;padding-left:40px;padding-right:40px}.hero{padding-top:40px}.hero h1{font-size:36px}.input-box{padding:24px}.bottom-nav{border-left:1px solid var(--line);border-right:1px solid var(--line)}}@media(max-width:420px){.shell{padding-left:20px;padding-right:20px}.hero h1{font-size:30px}.field{font-size:16px}.input-box{padding:16px;gap:11px}.demo{gap:10px}.demo strong{font-size:14px}.demo span{font-size:11px}.sample-actions button{font-size:12px}.result-title{font-size:24px}.section-head h2{font-size:19px}.issue-body{padding:0 14px}.topnote{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.spinner{animation:none}}

.result-title:focus,.history h1:focus{outline:none}.demo-figure{margin:20px 0 0}.demo-photo{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin:20px 0 0}.demo-figure .demo-photo{margin:0}.demo-figure figcaption{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}.demo-source-paragraph{font-size:15px;line-height:1.9;margin-top:22px}
/* Compact article overview and analysis workspace. */
.result{padding-top:12px}.result>.back{min-height:30px;font-size:12px;margin-bottom:9px}
.result .article-card{margin:0;background:#f7f8fa;border:1px solid #edf0f3;padding:16px;border-radius:6px}
.article-top{display:flex;gap:14px;align-items:flex-start}.article-heading{min-width:0;flex:1;word-break:keep-all}.article-heading .meta{font-size:10px;color:#6b7684;margin-bottom:5px}.article-heading .result-title{font-size:21px;line-height:1.5;letter-spacing:-.8px;margin:0}
#article-thumbnail{width:82px;flex-shrink:0}#article-thumbnail .demo-photo{width:82px;height:86px;aspect-ratio:auto;object-fit:cover;margin:0;border-radius:4px}
.article-card .result-summary{font-size:13px;line-height:1.75;margin-top:12px;color:#4e5968}.article-card #original-input details{margin-top:11px;padding-top:6px}.article-card #original-input summary{font-size:11px}.article-card #result-notice{padding:0;margin:9px 0 0;background:none;font-size:10px;color:#8b95a1}

.result-tabs{display:flex;border-bottom:1px solid #e5e8eb;margin-bottom:16px;gap:24px}.result-tabs button{position:relative;padding:12px 4px;min-width:48px;border:0;background:none;color:#8b95a1;font-size:15px;font-weight:700}.result-tabs button[aria-selected=true]{color:#1b64da}.result-tabs button[aria-selected=true]:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:#3182f6}
#issue-panel:focus,#all-sources:focus{outline:none}#issues summary{padding:16px 14px;font-size:14px}.opinion{padding:16px 0}.opinion h3{font-size:17px;line-height:1.55;margin-top:9px;font-weight:700}.opinion p{font-size:13px;line-height:1.75;color:#6b7684}.evidence-label{margin-top:10px}.source{padding:8px 11px;margin-top:12px}.source strong{font-size:10px}.source a{padding:6px 0}
.source-card{display:flex;gap:12px;align-items:flex-start;text-decoration:none;padding:17px 0;border-bottom:1px solid #edf0f3}.source-index{color:#8b95a1;font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}.source-copy{flex:1;min-width:0}.source-copy strong{display:block;color:#333d4b;font-size:14px;font-weight:650;overflow-wrap:anywhere}.source-copy small{display:block;font-size:11px;color:#8b95a1;margin-top:5px;overflow-wrap:anywhere}.source-arrow{color:#3182f6;font-size:17px}.source-card:hover .source-copy strong{color:#1b64da}.result .save{margin-top:10px}

<body>
<div class="shell" id="page-shell">
  <header>
    <a href="#home" class="brand brand-mark" id="brand" aria-label="GRAY 홈"><img class="brand-symbol" src="assets/gray-mark.svg" alt="" width="28" height="28" aria-hidden="true"><span>GRAY</span></a><span class="topnote">다양한 관점으로 읽기</span>
    <button class="menu-btn" id="open-menu" aria-label="메뉴 열기" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <main>
    <section id="home" class="screen active" aria-label="기사 입력">
      <div class="hero">
        <h1>하나의 기사,<br>여러 관점</h1>
        <form id="article-form" class="input-box" novalidate>
          <div class="input-top"><label for="article-url">기사 분석</label><button class="input-mode" type="button" id="toggle-text" aria-controls="article-text" aria-expanded="false">본문 직접 입력</button></div>
          <input id="article-url" class="field" type="url" inputmode="url" placeholder="기사 링크 붙여넣기" aria-describedby="form-message">
          <textarea id="article-text" class="field" placeholder="기사 내용을 붙여넣어 주세요" aria-label="기사 내용" aria-describedby="form-message" hidden></textarea>
          <button class="primary" id="analyze-button" type="submit">분석하기</button>
          <button class="secondary" id="preview-result" type="button">결과 화면 미리보기 →</button>
          <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span>관련 자료를 찾고 있어요</span></div>
          <button type="button" class="text-btn" id="cancel-analysis" hidden>분석 취소</button>
          <p id="form-message" class="helper" role="status" aria-live="polite"></p>
        </form>
        <div class="demo">
          <div class="demo-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h4M8 16h8"/></svg></div>
          <div class="demo-copy"><strong>어떤 결과가 나올까요?</strong><span>입력 없이 먼저 살펴보세요</span></div>
          <div class="sample-actions"><button id="try-demo" type="button">샘플 보기 ›</button></div>
        </div>
        <div class="old-demo"><button id="try-old-demo" type="button">공원 예시 보기 ↗</button></div>
      </div>
      <div class="home-records">
        <div class="section-head"><h2>최근 기록</h2><button data-go="history">전체 보기 ›</button></div>
        <div id="recent-records"></div>
      </div>
    </section>
    <section id="result" class="screen" aria-label="분석 결과">
      <div class="result">
        <button class="back" data-go="home">← 새 분석</button>
        <article class="original article-card">
          <div class="article-top">
            <div class="article-heading"><p class="meta" id="result-meta"></p><h1 class="result-title" id="result-title" tabindex="-1"></h1></div>
            <div id="article-thumbnail" hidden></div>
          </div>
          <p class="result-summary" id="result-summary"></p>
          <div id="original-input"></div>
          <p class="notice" id="result-notice"></p>
        </article>
        <div id="analysis-counts" class="analysis-counts" aria-label="분석 개요"></div>
        <div class="result-tabs" role="tablist" aria-label="분석 결과 보기">
          <button id="issues-tab" role="tab" aria-selected="true" aria-controls="issue-panel">쟁점</button>
          <button id="sources-tab" role="tab" aria-selected="false" aria-controls="all-sources" tabindex="-1">출처</button>
        </div>
        <div id="issue-panel" role="tabpanel" aria-labelledby="issues-tab" tabindex="0">
          <div id="issues"></div>
          <div id="legacy-result" class="legacy-text" hidden></div>
        </div>
        <div id="all-sources" role="tabpanel" aria-labelledby="sources-tab" tabindex="0" hidden></div>
        <button id="save-record" class="secondary save">내 기록에 저장</button>
        <p id="save-message" class="helper" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section id="history" class="screen" aria-label="내 기록">
      <div class="history"><h1 id="history-title" tabindex="-1">내 기록</h1>
        <p class="helper">이 브라우저에 저장한 분석</p>
        <p id="history-message" class="helper" role="status" aria-live="polite"></p><div id="records"></div>
      </div>
    </section>
  </main>
  <footer class="footer">GRAY · 뉴스의 또 다른 시선</footer>
  <nav class="bottom-nav" aria-label="주 메뉴">
    <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><span>분석</span></button>
    <button data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>내 기록</span></button>
  </nav>
</div>
<div id="overlay" class="overlay" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="메뉴" hidden>
  <div class="drawer-top"><span class="brand brand-mark"><img class="brand-symbol" src="assets/gray-mark.svg" alt="" width="28" height="28" aria-hidden="true"><span>GRAY</span></span><button id="close-menu" aria-label="메뉴 닫기">✕</button></div>
  <nav><button data-go="home">새 분석　→</button><button data-go="history">내 기록　→</button></nav>
  <p>뉴스의 또 다른 시선</p>
</aside>
<script>
'use strict';
const $ = selector => document.querySelector(selector);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function isObject(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
function safeUrl(value) {
  if (typeof value !== 'string') return null;
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) && url.hostname && !url.username && !url.password ? url.href : null;
  } catch { return null; }
}
function sourceLink(source) {
  const a = element('a', '', source.title + ' ↗');
  a.href = source.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function normalizeSources(items, structured) {
  const result = new Map();
  const ambiguous = new Set();
  for (const [index, source] of items.entries()) {
    if (!isObject(source)) continue;
    const url = safeUrl(source.url);
    const id = structured ? source.id : 'legacy-' + index;
    if (!url || typeof id !== 'string' || !id.trim()) continue;
    const title = typeof source.title === 'string' && source.title.trim() ? source.title : url;
    if (result.has(id)) ambiguous.add(id);
    else result.set(id, {id, title, url});
  }
  for (const id of ambiguous) result.delete(id);
  return [...result.values()];
}
function normalizeAnalysis(data) {
  if (!isObject(data)) throw new Error('분석 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
  if (data.version === 1) {
    if (typeof data.title !== 'string' || typeof data.summary !== 'string' || !Array.isArray(data.issues) || !Array.isArray(data.sources)) {
      throw new Error('분석 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
    }
    const issues = data.issues.map(issue => {
      if (!isObject(issue) || typeof issue.question !== 'string' || !Array.isArray(issue.perspectives) || issue.perspectives.length > 3 || (issue.note != null && typeof issue.note !== 'string')) {
        throw new Error('쟁점 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
      }
      const perspectives = issue.perspectives.map(view => {
        if (!isObject(view) || !['actor', 'claim', 'evidence'].every(key => typeof view[key] === 'string') || !Array.isArray(view.sourceIds)) {
          throw new Error('관점 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
        }
        return {actor: view.actor, claim: view.claim, evidence: view.evidence, sourceIds: view.sourceIds.filter(id => typeof id === 'string')};
      });
      return {question: issue.question, perspectives, note: issue.note || null};
    });
    return {version: 1, title: data.title, summary: data.summary, issues, sources: normalizeSources(data.sources, true)};
  }
  // 이전 API 응답과 gray-live-records의 텍스트·인용을 그대로 읽는다.
  if (data.version === undefined && typeof data.text === 'string' && Array.isArray(data.sources)) {
    return {text: data.text, sources: normalizeSources(data.sources, false), citations: Array.isArray(data.citations) ? data.citations : []};
  }
  throw new Error('지원하지 않는 분석 결과 형식입니다. 다시 시도해 주세요.');
}
function cleanInput(input) {
  return {url: isObject(input) && typeof input.url === 'string' ? input.url : '', text: isObject(input) && typeof input.text === 'string' ? input.text : ''};
}

function renderIssue(issue, index, sources, kind) {
  const card = element('details', 'issue'); card.open = index === 0;
  const summary = element('summary');
  summary.append(element('span', 'issue-no', String(index + 1).padStart(2, '0')), element('span', '', issue.question));
  card.append(summary);
  const body = element('div', 'issue-body');
  if (issue.note) body.append(element('p', 'notice', issue.note));
  const thread = element('div', 'thread');
  for (const [viewIndex, view] of issue.perspectives.entries()) {
    const opinion = element('article', 'opinion' + (viewIndex % 2 ? ' against' : ''));
    opinion.append(element('div', 'label', view.actor || '관점 ' + (viewIndex + 1)));
    const links = [...new Set(view.sourceIds)].map(id => sources.get(id)).filter(Boolean);
    const supported = links.length > 0 && view.evidence.trim() && view.claim.trim();
    if (supported || kind === 'demo') {
      opinion.append(element('h3', '', view.claim), element('span', 'evidence-label', kind === 'demo' && !links.length ? '시연용 가상 근거' : '근거'), element('p', '', view.evidence));
      const sourceBox = element('div', 'source');
      sourceBox.append(element('strong', '', '관련 출처'));
      for (const source of links) sourceBox.append(sourceLink(source));
      if (!links.length) sourceBox.append(element('p', '', '시연용 가상 자료 · 실제 출처 없음'));
      if (links.length && view.sourceIds.some(id => !sources.has(id))) sourceBox.append(element('p', '', '일부 출처를 확인하지 못했습니다.'));
      opinion.append(sourceBox);
    } else {
      opinion.append(element('h3', '', '자료 부족'), element('p', '', '이 관점은 주장과 근거를 뒷받침하는 출처를 확인하지 못했습니다.'));
    }
    thread.append(opinion);
  }
  if (!issue.perspectives.length) thread.append(element('p', 'empty', '이 쟁점의 관점별 자료를 찾지 못했습니다.'));
  body.append(thread); card.append(body); return card;
}
function renderLegacy(data) {
  const node = $('#legacy-result'); node.replaceChildren(); node.hidden = false;
  const chars = Array.from(data.text); let cursor = 0;
  const citations = data.citations.filter(isObject).sort((a, b) => a.end - b.end);
  for (const citation of citations) {
    const url = safeUrl(citation.url);
    if (!url || !Number.isInteger(citation.start) || !Number.isInteger(citation.end) || citation.start < 0 || citation.start >= citation.end || citation.end < cursor || citation.end > chars.length) continue;
    node.append(document.createTextNode(chars.slice(cursor, citation.end).join('')));
    const a = sourceLink({url, title: typeof citation.title === 'string' ? citation.title : '출처'});
    a.textContent = ' [출처: ' + (typeof citation.title === 'string' ? citation.title : url) + ']';
    node.append(a); cursor = citation.end;
  }
  node.append(document.createTextNode(chars.slice(cursor).join('')));
}
function selectResultTab(name, focus = false) {
  for (const [key, panel] of [['issues','issue-panel'], ['sources','all-sources']]) {
    const active = name === key;
    const tab = $('#' + key + '-tab');
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
    $('#' + panel).hidden = !active;
    if (active && focus) tab.focus();
  }
}

    thumbnail.append(photo); thumbnail.hidden = false;
  }
  $('#result-meta').textContent = kind === 'sample' ? '샘플' : kind === 'demo' ? '공원 예시' : '분석 결과';

  $('#result-summary').textContent = analysis.summary || '이전에 저장한 분석 내용을 아래에서 확인하세요.';
  const original = $('#original-input'); original.replaceChildren();
  if (input.url || input.text) {
    const details = element('details'); details.append(element('summary', '', '내가 입력한 기사 확인'));
    const url = safeUrl(input.url);
    if (url) details.append(sourceLink({title: '입력 기사 원문', url}));

    original.append(details);
  }
  $('#issues').replaceChildren(); $('#legacy-result').replaceChildren(); $('#legacy-result').hidden = true;
  const counts = $('#analysis-counts'); counts.replaceChildren();
  if (analysis.version === 1) {
    for (const [label, count] of [['쟁점',analysis.issues.length], ['관점',analysis.issues.reduce((sum, issue) => sum + issue.perspectives.length, 0)], ['출처',analysis.sources.length]]) {
      const item = element('span'); item.append(document.createTextNode(label + ' '),element('strong','',String(count))); counts.append(item);
    }
  } else {
    const item = element('span'); item.append(document.createTextNode('출처 '),element('strong','',String(analysis.sources.length))); counts.append(item);
  }
  const sources = new Map(analysis.sources.map(source => [source.id, source]));
  if (analysis.version === 1) {
    for (const [index, issue] of analysis.issues.entries()) $('#issues').append(renderIssue(issue, index, sources, kind));
    if (!analysis.issues.length) $('#issues').append(element('p', 'notice', '관련 자료에서 비교할 쟁점을 찾지 못했습니다.'));
  } else renderLegacy(analysis);
  const allSources = $('#all-sources'); allSources.replaceChildren();
  if (!analysis.sources.length) allSources.append(element('p', 'empty', '연결된 출처가 없어요.'));
  for (const [index, source] of analysis.sources.entries()) {

  $('#save-message').textContent = ''; $('#save-message').className = 'helper';
  show('result');
}

function storageArray(key) {
  const raw = localStorage.getItem(key);
  if (raw === null) return null;
  const data = JSON.parse(raw);
  if (!Array.isArray(data)) throw new Error('기록 형식 오류');
  return data;
}
function readRecords() {
  storageWarning = ''; storageReadable = true;
  const valid = [];
  try {
    const saved = storageArray(RECORDS_KEY);
    if (saved !== null) {
      const ids = new Set();
      for (const item of saved) {
        try {
          if (!isObject(item) || typeof item.id !== 'string' || ids.has(item.id)) throw new Error('기록 형식 오류');
          valid.push({id: item.id, savedAt: typeof item.savedAt === 'string' ? item.savedAt : '', input: cleanInput(item.input), kind: ['demo', 'sample'].includes(item.kind) ? item.kind : 'analysis', analysis: normalizeAnalysis(item.analysis)});
          ids.add(item.id);
        } catch { storageWarning = '일부 기록을 읽지 못했습니다. 기존 저장 데이터는 변경하지 않았습니다.'; storageReadable = false; }
      }
    } else {
      // 이전 키는 지우지 않는다. 첫 저장/삭제 후 새 목록만 사용해 삭제한 기록의 재등장을 방지한다.
      for (const [i, item] of (storageArray('gray-demo-records') || []).entries()) {
        if (!isObject(item)) continue;
        valid.push({id: 'legacy-demo-' + i, kind: 'demo', savedAt: typeof item.savedAt === 'string' ? item.savedAt : '', input: {url: '', text: ''}, analysis: normalizeAnalysis(PARK_DEMO)});
      }
      for (const [i, item] of (storageArray('gray-live-records') || []).entries()) {
        try {
          if (!isObject(item)) throw new Error('기록 형식 오류');
          valid.push({id: 'legacy-live-' + i, kind: 'analysis', savedAt: typeof item.savedAt === 'string' ? item.savedAt : '', input: {url: '', text: typeof item.article === 'string' ? item.article : ''}, analysis: normalizeAnalysis(item)});
        } catch { storageWarning = '일부 이전 기록을 읽지 못했습니다. 기존 저장 데이터는 변경하지 않았습니다.'; storageReadable = false; }
      }
    }
  } catch { storageWarning = '브라우저 기록을 읽지 못했습니다. 저장 공간 설정을 확인해 주세요.'; storageReadable = false; }
  return valid.sort((a, b) => (Date.parse(b.savedAt) || 0) - (Date.parse(a.savedAt) || 0));
}
function persistRecords(next) {
  if (!storageReadable) throw new Error(storageWarning || '저장된 기록을 읽지 못해 변경할 수 없습니다.');
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(next)); }
  catch { throw new Error('기록을 저장하지 못했습니다. 브라우저 저장 공간이나 설정을 확인해 주세요.'); }
  records = next;
}
function renderHistory() {
  const list = $('#records'); list.replaceChildren();
  $('#history-message').textContent = storageWarning;
  if (!records.length) list.append(element('p', 'empty', '아직 저장한 기록이 없어요. 결과 화면에서 내 기록에 저장해 보세요.'));
  for (const record of records) {
    const row = element('div', 'record');
    const open = element('button', 'record-open'); open.type = 'button'; open.dataset.record = record.id;
    const title = record.analysis.title || record.input.text.slice(0, 60) || '이전 분석 결과';
    const date = Date.parse(record.savedAt);
    const kind = record.kind === 'sample' ? '샘플' : record.kind === 'demo' ? '시연용 예시' : '기사 분석';
    open.append(element('strong', '', title), element('small', '', (Number.isFinite(date) ? new Date(date).toLocaleDateString('ko-KR') : '저장 날짜 없음') + ' · ' + kind));
    const remove = element('button', 'record-delete', '삭제'); remove.type = 'button'; remove.dataset.delete = record.id;
    remove.setAttribute('aria-label', title + ' 기록 삭제'); row.append(open, remove); list.append(row);
  }
}
function fingerprint(result) { return JSON.stringify({kind: result.kind, input: result.input, analysis: result.analysis}); }
function saveRecord() {
  if (!currentResult) return;
  try {
    // 다른 탭의 저장·삭제도 반영한 뒤 기록한다.
    records = readRecords();
    if (!storageReadable) throw new Error(storageWarning);
    if (records.some(record => fingerprint(record) === fingerprint(currentResult))) {
      $('#save-message').textContent = '이미 내 기록에 저장한 결과입니다.'; return;
    }
    const id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
    persistRecords([{...currentResult, id, savedAt: new Date().toISOString()}, ...records]);
    $('#save-message').className = 'helper'; $('#save-message').textContent = '이 브라우저의 내 기록에 저장했어요.';
  } catch (error) { $('#save-message').className = 'helper error'; $('#save-message').textContent = error.message; }
}
function setBusy(busy) {
  $('#article-form').setAttribute('aria-busy', String(busy));
  for (const id of ['article-url', 'article-text', 'toggle-text', 'analyze-button', 'preview-result', 'try-demo', 'try-old-demo']) $('#' + id).disabled = busy;
  $('#loading').hidden = !busy; $('#cancel-analysis').hidden = !busy;
  $('#analyze-button').textContent = busy ? '분석 중…' : '분석하기';
}
function formError(message, field) {
  $('#form-message').className = 'helper error'; $('#form-message').textContent = message;
  if (field) field.focus();
}
async function submitArticle(event) {
  event.preventDefault();
  if (pendingRequest) return;
  const url = $('#article-url').value.trim(); const text = $('#article-text').value.trim();
  if (!url && !text) { formError('기사 링크나 내용을 입력해 주세요.', $('#article-url')); return; }
  if (!text && !safeUrl(url)) { formError('http 또는 https로 시작하는 기사 링크를 입력해 주세요.', $('#article-url')); return; }
  if (!text && safeUrl(url) === demoLink('article')) { showServiceDemo(); return; }
  if (Array.from(text).length > 50000 || Array.from(url).length > 50000) { formError('기사 내용은 50,000자 이내로 입력해 주세요.'); return; }
  if (location.protocol === 'file:') { formError('서버를 실행한 뒤 http://127.0.0.1:8765 에서 이용해 주세요. 샘플은 바로 볼 수 있어요.'); return; }
  const request = {controller: new AbortController(), timedOut: false}; pendingRequest = request;
  const timer = setTimeout(() => { request.timedOut = true; request.controller.abort(); }, REQUEST_TIMEOUT_MS);
  setBusy(true); $('#form-message').className = 'helper'; $('#form-message').textContent = '';
  let openText = false;
  try {
    // A와 합의한 계약. 샘플과 같은 version 1 응답을 받으면 즉시 카드로 표시한다.
    const response = await fetch('/api/analyze', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url, text}), signal: request.controller.signal});
    let data;
    try { data = await response.json(); } catch { throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
    if (!response.ok) {
      openText = response.status === 422 || data?.code === 'ARTICLE_UNAVAILABLE';
      const fallback = response.status === 504 ? '분석 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.' : openText ? '기사 본문을 확인하지 못했습니다. 본문을 붙여넣어 주세요.' : '분석하지 못했습니다. 다시 시도해 주세요.';
      const legacyInputError = data?.error === '기사 내용은 1~50,000자로 입력해 주세요.';
      throw new Error(legacyInputError ? '현재 서버와 입력 형식이 맞지 않습니다. 결과 화면 미리보기를 이용해 주세요.' : typeof data?.error === 'string' && data.error.trim() ? data.error : fallback);
    }
    renderAnalysis(data, {input: {url, text}});
  } catch (error) {
    const message = request.controller.signal.aborted ? request.timedOut ? '분석 시간이 초과되었습니다. 입력 내용은 유지됩니다. 다시 시도해 주세요.' : '분석을 취소했습니다. 입력 내용은 그대로 남아 있어요.' : error instanceof TypeError ? '서버에 연결하지 못했습니다. 서버 실행 상태를 확인해 주세요.' : error.message;
    formError(message);
  } finally {
    clearTimeout(timer); pendingRequest = null; setBusy(false);
    if (openText) { $('#article-text').hidden = false; $('#toggle-text').setAttribute('aria-expanded', 'true'); $('#article-text').focus(); }
  }
}


const documentSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg>';
function renderRecent() {
  records = readRecords();
  const list = $('#recent-records'); list.replaceChildren();
  if (storageWarning) { list.append(element('p', 'helper error', storageWarning)); return; }
  if (!records.length) {
    const empty = element('div', 'recent-empty');
    const icon = element('span', 'document-icon'); icon.innerHTML = documentSvg;
    empty.append(icon, element('span', '', '저장한 분석이 여기에 모여요')); list.append(empty);
  }
  for (const record of records.slice(0, 3)) {
    const row = element('button', 'recent-row'); row.type = 'button'; row.dataset.recent = record.id;
    const icon = element('span', 'document-icon'); icon.innerHTML = documentSvg;
    const copy = element('span', 'recent-copy');
    copy.append(element('strong', '', record.analysis.title || record.input.text.slice(0, 60) || '이전 분석 결과'));
    const date = Date.parse(record.savedAt);
    copy.append(element('small', '', Number.isFinite(date) ? new Date(date).toLocaleDateString('ko-KR') : '저장한 분석'));
    row.append(icon, copy, element('span', 'row-chevron', '›')); list.append(row);
  }
}
$('#recent-records').addEventListener('click', event => {
  const button = event.target.closest('[data-recent]');
  if (!button) return;
  const record = records.find(item => item.id === button.dataset.recent);
  if (record) renderAnalysis(record.analysis, record);
});
renderRecent();

$('#article-form').addEventListener('submit', submitArticle);
for (const name of ['issues','sources']) {
  $('#' + name + '-tab').addEventListener('click', () => selectResultTab(name));
  $('#' + name + '-tab').addEventListener('keydown', event => {
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    event.preventDefault();
    selectResultTab(event.key === 'Home' ? 'issues' : event.key === 'End' ? 'sources' : name === 'issues' ? 'sources' : 'issues', true);
  });
}
$('#cancel-analysis').addEventListener('click', () => pendingRequest?.controller.abort());
$('#toggle-text').addEventListener('click', () => {
  const textarea = $('#article-text'); textarea.hidden = !textarea.hidden;
  $('#toggle-text').setAttribute('aria-expanded', String(!textarea.hidden));
  if (!textarea.hidden) textarea.focus();
});
$('#try-demo').addEventListener('click', () => renderAnalysis(SAMPLE_ANALYSIS, {kind: 'sample'}));
$('#try-old-demo').addEventListener('click', () => renderAnalysis(PARK_DEMO, {kind: 'demo'}));
$('#preview-result').addEventListener('click', showServiceDemo);
$('#save-record').addEventListener('click', saveRecord);
$('#open-menu').addEventListener('click', openMenu);
$('#close-menu').addEventListener('click', () => closeMenu());
$('#overlay').addEventListener('click', () => closeMenu());
document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => { if (button.dataset.go === 'history') records = readRecords(); show(button.dataset.go); }));
$('#brand').addEventListener('click', event => { event.preventDefault(); show('home'); });
document.addEventListener('keydown', event => {
  if ($('#drawer').hidden) return;
  if (event.key === 'Escape') { event.preventDefault(); closeMenu(); }
  if (event.key === 'Tab') {
    const buttons = [...$('#drawer').querySelectorAll('button')];
    if (event.shiftKey && document.activeElement === buttons[0]) { event.preventDefault(); buttons.at(-1).focus(); }
    else if (!event.shiftKey && document.activeElement === buttons.at(-1)) { event.preventDefault(); buttons[0].focus(); }
  }
});
$('#records').addEventListener('click', event => {
  const open = event.target.closest('[data-record]'); const remove = event.target.closest('[data-delete]');
  if (open) {
    const record = records.find(item => item.id === open.dataset.record);
    if (record) renderAnalysis(record.analysis, record);
  } else if (remove) {
    try {
      records = readRecords();
      persistRecords(records.filter(item => item.id !== remove.dataset.delete)); renderHistory();
      $('#history-message').textContent = '기록을 삭제했습니다.';
      ($('#records button') || $('#history-title')).focus();
    } catch (error) { $('#history-message').textContent = error.message; }
  }
});
window.addEventListener('storage', event => {
  if ([RECORDS_KEY, 'gray-demo-records', 'gray-live-records', null].includes(event.key)) {
    records = readRecords(); if ($('#history').classList.contains('active')) renderHistory();
    if ($('#home').classList.contains('active')) renderRecent();
  }
});
const preview = new URLSearchParams(location.search).get('preview');
if (new URLSearchParams(location.search).get('demo') === 'service') showServiceDemo();
else if (new URLSearchParams(location.search).get('demo') === 'source') showDemoSource(new URLSearchParams(location.search).get('id'));
else if (preview === 'result') renderAnalysis(PARK_DEMO, {kind: 'demo'});
else if (preview === 'sample') renderAnalysis(SAMPLE_ANALYSIS, {kind: 'sample'});
else if (preview === 'history') show('history');
</script>
