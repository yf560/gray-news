</main></div><script>
'use strict';

    {id:'R2',title:'유엔 · 안보리 결의 2270호 사치품 목록',url:'https://mandates.un.org/mandate/S/RES/2270%20%282016%29?subject=Consumer+Goods'},
    {id:'R3',title:'MBC · 미 국무부의 스키 장비 제재 입장',url:'https://imnews.imbc.com/news/2026/world/article/6868402_36925.html'},
    {id:'R4',title:'뉴스핌 · 제조사 해명과 유통 경로 확인 문제',url:'https://web3.newspim.com/news/view/20261125000111'}

function matchesReviewArticle(url) {
  const safe = safeUrl(url); if (!safe) return false;
  const parsed = new URL(safe);
  return parsed.hostname === 'www.mbn.co.kr' && parsed.pathname.replace(/\/$/,'') === '/vod/programView/1434541';
}
function openReviewResult(input) { renderAnalysis(MBN_REVIEW_ANALYSIS,{kind:'review',input}); }
const RECORDS_KEY = 'gray-records-v1';
const REQUEST_TIMEOUT_MS = 480000;
let currentResult = null;
let pendingRequest = null;
let inputMode = 'url';
let storageWarning = '';
let storageReadable = true;
let records = readRecords();
let resultReturnScreen = 'home';
let lastDeletedRecord = null;

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function isObject(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
function safeUrl(value) {
  if (typeof value !== 'string') return null;
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) && url.hostname && !url.username && !url.password ? url.href : null;
  } catch { return null; }
}
function normalizeArticleImage(value) {
  if (!isObject(value)) return null;
  const url = safeUrl(value.url);
  if (!url) return null;
  return {url,alt:typeof value.alt === 'string' && value.alt.trim() ? value.alt : '기사 대표 사진',credit:typeof value.credit === 'string' ? value.credit : '',sourceUrl:safeUrl(value.sourceUrl)};
}
function withArticleImage(analysis, raw) {
  const articleImage = normalizeArticleImage(raw.articleImage);
  return articleImage ? {...analysis,articleImage} : analysis;
}
function renderArticleImage(image, articleUrl) {
  const figure = $('#article-figure'); figure.replaceChildren(); figure.hidden = true;
  const safe = normalizeArticleImage(image); if (!safe) return;
  const photo = element('img','article-photo'); photo.alt = safe.alt;
  photo.decoding = 'async'; photo.referrerPolicy = 'no-referrer';
  const media = element('div','article-media'); media.append(photo);
  const caption = element('figcaption');
  const credit = safe.credit.trim() || new URL(safe.url).hostname;
  const sourceUrl = safe.sourceUrl || safeUrl(articleUrl);
  if (sourceUrl) caption.append(sourceLink({title:'사진 · ' + credit,url:sourceUrl}));
  else caption.textContent = '사진 · ' + credit;
  photo.addEventListener('load',()=>{if (figure.contains(photo)) media.classList.add('loaded');});
  photo.addEventListener('error',()=>{if (figure.contains(photo)) {figure.hidden=true;figure.replaceChildren();}});
  figure.append(media,caption); figure.hidden=false; photo.src=safe.url;
}
function setSaveLabel(label) {
  const button = $('#save-record');
  const icon = element('span','save-icon'); icon.setAttribute('aria-hidden','true');
  icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
  button.replaceChildren(icon,element('span','',label));
}
function sourceLink(source) {
  const a = element('a', '', source.title + ' ↗');
  a.href = source.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function normalizeSources(items, structured) {
  const result = new Map();
  const ambiguous = new Set();
  for (const [index, source] of items.entries()) {
    if (!isObject(source)) continue;
    const url = safeUrl(source.url);
    const id = structured ? source.id : 'legacy-' + index;
    if (!url || typeof id !== 'string' || !id.trim()) continue;
    const title = typeof source.title === 'string' && source.title.trim() ? source.title : url;
    if (result.has(id)) ambiguous.add(id);
    else result.set(id, {id, title, url});
  }
  for (const id of ambiguous) result.delete(id);
  return [...result.values()];
}
function normalizeAnalysis(data) {
  if (!isObject(data)) throw new Error('분석 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
  if (data.version === 1) {
    if (typeof data.title !== 'string' || typeof data.summary !== 'string' || !Array.isArray(data.issues) || !Array.isArray(data.sources)) {
      throw new Error('분석 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
    }
    const issues = data.issues.map(issue => {
      if (!isObject(issue) || typeof issue.question !== 'string' || !Array.isArray(issue.perspectives) || issue.perspectives.length > 3 || (issue.note != null && typeof issue.note !== 'string')) {
        throw new Error('쟁점 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
      }
      const perspectives = issue.perspectives.map(view => {
        if (!isObject(view) || !['actor', 'claim', 'evidence'].every(key => typeof view[key] === 'string') || !Array.isArray(view.sourceIds)) {
          throw new Error('관점 결과 형식이 올바르지 않습니다. 다시 시도해 주세요.');
        }
        return {actor: view.actor, claim: view.claim, evidence: view.evidence, sourceIds: view.sourceIds.filter(id => typeof id === 'string')};
      });
      return {question: issue.question, perspectives, note: issue.note || null};
    });
    return withArticleImage({version: 1, title: data.title, summary: data.summary, issues, sources: normalizeSources(data.sources, true)},data);
  }
  // 이전 API 응답과 gray-live-records의 텍스트·인용을 그대로 읽는다.
  if (data.version === undefined && typeof data.text === 'string' && Array.isArray(data.sources)) {
    return withArticleImage({text: data.text, sources: normalizeSources(data.sources, false), citations: Array.isArray(data.citations) ? data.citations : []},data);
  }
  throw new Error('지원하지 않는 분석 결과 형식입니다. 다시 시도해 주세요.');
}
function cleanInput(input) {
  return {url: isObject(input) && typeof input.url === 'string' ? input.url : '', text: isObject(input) && typeof input.text === 'string' ? input.text : ''};
}
function show(name, options = {}) {
  if (!['home','result','history'].includes(name)) name = 'home';
  if (name === 'result' && !currentResult) name = 'home';
  const previous = document.querySelector('.screen.active')?.id;
  $('#page-shell').classList.toggle('is-home', name === 'home');
  document.querySelectorAll('.screen').forEach(node => node.classList.toggle('active', node.id === name));
  if (name === 'history') { records = readRecords(); renderHistory(); loadJobs(); }
  if (name === 'home') { records = readRecords(); renderRecentRecords(); }
  document.querySelectorAll('header [data-go]').forEach(button => {
    if (button.dataset.go === (name === 'history' ? 'history' : 'home')) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  const focus = name === 'result' ? $('#result-title') : name === 'history' ? $('#history-title') : inputMode === 'text' ? $('#article-text') : $('#article-url');
  focus.focus({preventScroll:true}); window.scrollTo(0,0);
  document.title = name === 'home' ? 'GRAY — 뉴스 관점 비교' : name === 'history' ? '저장한 기사 — GRAY' : '분석 결과 — GRAY';
  if (options.navigate !== false) {
    const state = {gray:true,screen:name};
    if (name === 'result') Object.assign(state,{result:currentResult,returnScreen:resultReturnScreen,resultTab:'issues'});
    const address = new URL(location.href); address.hash = name;
    if (previous !== name) history.pushState(state,'',address);
    else history.replaceState(state,'',address);
  }
}
function selectInputMode(mode, focus = true) {
  inputMode = mode;
  $('#url-panel').hidden = mode !== 'url'; $('#text-panel').hidden = mode !== 'text';
  for (const name of ['url','text']) {
    const tab = $('#' + name + '-tab');
    tab.setAttribute('aria-selected', String(mode === name)); tab.tabIndex = mode === name ? 0 : -1;
  }
  $('#form-message').textContent = '';
  if (focus) (mode === 'text' ? $('#article-text') : $('#article-url')).focus();

function renderIssue(issue, index, sources) {
  const card = element('details', 'issue'); card.open = index === 0;
  const summary = element('summary');
  summary.append(element('span', 'issue-no', String(index + 1).padStart(2, '0')), element('span', 'issue-question', issue.question));
  card.append(summary);
  const body = element('div', 'issue-body');
  if (issue.note) body.append(element('p', 'notice', issue.note));
  const thread = element('div', 'thread');
  thread.dataset.views = String(issue.perspectives.length);
  for (const [viewIndex, view] of issue.perspectives.entries()) {
    const opinion = element('article', 'opinion view-' + (viewIndex + 1));
    const heading = element('div','perspective-heading');
    const actor = element('h3','label',view.actor || '이름 없는 관점');
    actor.id = 'view-heading-' + index + '-' + viewIndex;
    opinion.setAttribute('aria-labelledby',actor.id);
    heading.append(element('span','view-index','관점 ' + String(viewIndex + 1).padStart(2,'0')),actor);
    opinion.append(heading);
    const links = [...new Map(view.sourceIds.map(id => sources.get(id)).filter(Boolean).map(source => [source.url,source])).values()];
    const supported = links.length > 0 && view.evidence.trim() && view.claim.trim();
    if (supported) {
      opinion.append(element('p','view-claim',view.claim));
      const evidence = element('details','view-details'); evidence.open = matchMedia('(min-width:760px)').matches;
      const disclosure = element('summary');
      disclosure.append(element('span','view-detail-label','근거·출처'),element('span','view-detail-count',links.length + '개 자료'));
      const evidenceBody = element('div','view-evidence');
      evidenceBody.append(element('p','evidence-copy',view.evidence));
      const sourceBox = element('div', 'source source-chips'); sourceBox.setAttribute('aria-label','이 주장의 근거 출처');
      for (const source of links) {
        const publisher = source.title.includes(' · ') ? source.title.split(' · ')[0] : new URL(source.url).hostname.replace(/^www\./,'');
        const link = sourceLink({title:String(source.number).padStart(2,'0') + ' · ' + publisher,url:source.url});
        link.className = 'source-chip'; link.setAttribute('aria-label',source.title + ' 원문 열기'); sourceBox.append(link);
      }
      if (links.length && view.sourceIds.some(id => !sources.has(id))) sourceBox.append(element('p', '', '일부 출처를 확인하지 못했습니다.'));
      evidenceBody.append(sourceBox); evidence.append(disclosure,evidenceBody); opinion.append(evidence);
    } else {
      opinion.classList.add('is-unverified');
      opinion.append(element('p','view-claim','자료 부족'), element('p','evidence-copy','이 관점을 뒷받침하는 자료를 찾지 못했어요.'));
    }
    thread.append(opinion);
  }
  if (!issue.perspectives.length) thread.append(element('p', 'empty', '이 쟁점의 관점별 자료를 찾지 못했습니다.'));
  body.append(thread); card.append(body); return card;
}
function renderLegacy(data) {
  const node = $('#legacy-result'); node.replaceChildren(); node.hidden = false;
  const chars = Array.from(data.text); let cursor = 0;
  const citations = data.citations.filter(isObject).sort((a, b) => a.end - b.end);
  for (const citation of citations) {
    const url = safeUrl(citation.url);
    if (!url || !Number.isInteger(citation.start) || !Number.isInteger(citation.end) || citation.start < 0 || citation.start >= citation.end || citation.end < cursor || citation.end > chars.length) continue;
    node.append(document.createTextNode(chars.slice(cursor, citation.end).join('')));
    const a = sourceLink({url, title: typeof citation.title === 'string' ? citation.title : '출처'});
    a.textContent = ' [출처: ' + (typeof citation.title === 'string' ? citation.title : url) + ']';
    node.append(a); cursor = citation.end;
  }
  node.append(document.createTextNode(chars.slice(cursor).join('')));
}
function selectResultTab(name, focus = false, syncRoute = true) {
  $('#result').classList.toggle('is-sources',name === 'sources');
  for (const [key, panel] of [['issues','issue-panel'], ['sources','all-sources']]) {
    const active = name === key;
    const tab = $('#' + key + '-tab');
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
    $('#' + panel).hidden = !active;
    if (active && focus) tab.focus();
  }
  if (syncRoute && history.state?.gray && history.state.screen === 'result') history.replaceState({...history.state,resultTab:name},'',location.href);
  requestAnimationFrame(updateSummaryDisclosure);
}

}

  const kind = options.kind === 'review' ? 'review' : 'analysis';
  const input = cleanInput(options.input);

  $('#result-summary').classList.add('is-collapsed');
  $('#toggle-summary').setAttribute('aria-expanded','false'); $('#toggle-summary').textContent='더 보기'; $('#toggle-summary').hidden=true;
  $('.summary-block').hidden = !analysis.summary;
  renderArticleImage(analysis.articleImage,input.url);
  const original = $('#original-input'); original.replaceChildren();
  if (input.url || input.text) {
    const url = safeUrl(input.url);
    if (url) { const link = sourceLink({title:'기사 원문 열기',url}); link.className='original-link'; original.append(link); }
    if (input.text) { const details = element('details');details.append(element('summary','','입력한 본문'),element('p','input-preview',input.text));original.append(details); }
  }
  $('#issues').replaceChildren(); $('#legacy-result').replaceChildren(); $('#legacy-result').hidden = true;
  const counts = $('#analysis-counts'); counts.replaceChildren();
  const sourceURLs = new Map(); const sources = new Map();
  for (const source of analysis.sources) {
    if (!sourceURLs.has(source.url)) sourceURLs.set(source.url,{...source,number:sourceURLs.size+1});
    sources.set(source.id,sourceURLs.get(source.url));
  }
  if (analysis.version === 1) {

  } else {

  if (analysis.version === 1) {
    for (const [index, issue] of analysis.issues.entries()) $('#issues').append(renderIssue(issue, index, sources));
    if (!analysis.issues.length) $('#issues').append(element('p', 'notice', '관련 자료에서 비교할 쟁점을 찾지 못했습니다.'));

  if (!sourceURLs.size) allSources.append(element('p', 'empty', '연결된 출처가 없어요.'));

  selectResultTab('issues',false,false);
  $('#save-message').textContent = ''; $('#save-message').className = 'helper';
  setSaveLabel(records.some(record => fingerprint(record) === fingerprint(currentResult)) ? '저장한 기사 보기' : '기사 저장');
  show('result',{navigate:options.navigate});
  requestAnimationFrame(updateSummaryDisclosure);
}

function storageArray(key) {
  const raw = localStorage.getItem(key);
  if (raw === null) return null;
  const data = JSON.parse(raw);
  if (!Array.isArray(data)) throw new Error('기록 형식 오류');
  return data;
}
function readRecords() {
  storageWarning = ''; storageReadable = true;
  const valid = [];
  try {
    const saved = storageArray(RECORDS_KEY);
    if (saved !== null) {
      const ids = new Set();
      for (const item of saved) {
        if (isObject(item) && ['demo','sample'].includes(item.kind)) continue;
        if (isObject(item) && item.kind === 'review' && item.analysis?.title === '공공시설 운영 시간 확대, 기대와 우려') continue;
        try {
          if (!isObject(item) || typeof item.id !== 'string' || ids.has(item.id)) throw new Error('기록 형식 오류');
          valid.push({id: item.id, savedAt: typeof item.savedAt === 'string' ? item.savedAt : '', input: cleanInput(item.input), kind: item.kind === 'review' ? 'review' : 'analysis', analysis: normalizeAnalysis(item.analysis)});
          ids.add(item.id);
        } catch { storageWarning = '일부 기록을 읽지 못했습니다. 기존 저장 데이터는 변경하지 않았습니다.'; storageReadable = false; }
      }
    } else {
      // 이전 키는 지우지 않는다. 첫 저장/삭제 후 새 목록만 사용해 삭제한 기록의 재등장을 방지한다.
      for (const [i, item] of (storageArray('gray-live-records') || []).entries()) {
        try {
          if (!isObject(item)) throw new Error('기록 형식 오류');
          valid.push({id: 'legacy-live-' + i, kind: 'analysis', savedAt: typeof item.savedAt === 'string' ? item.savedAt : '', input: {url: '', text: typeof item.article === 'string' ? item.article : ''}, analysis: normalizeAnalysis(item)});
        } catch { storageWarning = '일부 이전 기록을 읽지 못했습니다. 기존 저장 데이터는 변경하지 않았습니다.'; storageReadable = false; }
      }
    }
  } catch { storageWarning = '브라우저 기록을 읽지 못했습니다. 저장 공간 설정을 확인해 주세요.'; storageReadable = false; }
  return valid.sort((a, b) => (Date.parse(b.savedAt) || 0) - (Date.parse(a.savedAt) || 0));
}
function persistRecords(next) {
  if (!storageReadable) throw new Error(storageWarning || '저장된 기록을 읽지 못해 변경할 수 없습니다.');
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(next)); }
  catch { throw new Error('기록을 저장하지 못했습니다. 브라우저 저장 공간이나 설정을 확인해 주세요.'); }
  records = next;
}
function renderHistory() {
  const list = $('#records'); list.replaceChildren();
  $('#history-message').textContent = storageWarning;
  $('#history-count').textContent = records.length + '개';
  $('#history-tools').hidden = !records.length;
  $('#delete-notice').hidden = !lastDeletedRecord;
  const query = $('#history-search').value.trim().toLocaleLowerCase();
  $('#clear-search').hidden = !query;
  const visible = records.filter(record => recordTitle(record).toLocaleLowerCase().includes(query));
  if (!records.length) {
    const empty=element('div','empty-state'); empty.append(element('h2','','아직 저장한 기사가 없어요'),element('p','','분석 결과에서 ‘기사 저장’을 눌러 모아보세요.'));
    const start=element('button','secondary','기사 분석하러 가기');start.type='button';start.addEventListener('click',()=>show('home'));empty.append(start);list.append(empty);
  }
  if (records.length && !visible.length) {
    const empty=element('div','empty-state');empty.append(element('h2','','검색 결과가 없어요'),element('p','','다른 제목으로 검색해 보세요.'));
    const clear=element('button','secondary','전체 기사 보기');clear.type='button';clear.addEventListener('click',clearHistorySearch);empty.append(clear);list.append(empty);
  }
  for (const record of visible) {
    const row = element('div', 'record');
    const open = element('button', 'record-open'); open.type = 'button'; open.dataset.record = record.id;
    const title = recordTitle(record);
    const date = Date.parse(record.savedAt);
    const copy = element('span','record-copy');
    const detail = record.analysis.version === 1 ? ' · 쟁점 ' + record.analysis.issues.length + '개' : '';
    copy.append(element('strong', '', title), element('small', '', (Number.isFinite(date) ? new Date(date).toLocaleDateString('ko-KR') : '저장 날짜 없음') + detail));
    const image = normalizeArticleImage(record.analysis.articleImage);
    if (image) {
      const photo=element('img','record-photo'); photo.alt='';photo.width=64;photo.height=64;photo.loading='lazy';photo.referrerPolicy='no-referrer';
      photo.addEventListener('error',()=>photo.remove());photo.src=image.url;open.append(photo);
    }
    open.append(copy);
    const remove = element('button', 'record-delete', '삭제'); remove.type = 'button'; remove.dataset.delete = record.id;
    remove.setAttribute('aria-label', title + ' 기록 삭제'); row.append(open, remove); list.append(row);
  }
}
function recordTitle(record) { return record.analysis.title || record.input.text.slice(0,60) || '이전 분석 결과'; }
function clearHistorySearch() { $('#history-search').value='';renderHistory();$('#history-search').focus(); }
function deleteRecord(id) {
  try {
    records=readRecords();const record=records.find(item=>item.id===id);if(!record){renderHistory();return;}
    persistRecords(records.filter(item=>item.id!==id));lastDeletedRecord=record;renderHistory();
    ($('#records .record-open') || $('#undo-delete')).focus();
  } catch(error) { $('#history-message').textContent=error.message; }
}
function undoDelete() {
  if(!lastDeletedRecord)return;
  try {
    records=readRecords();const restored=lastDeletedRecord;
    if(!records.some(item=>item.id===restored.id || fingerprint(item)===fingerprint(restored))) persistRecords([restored,...records]);
    lastDeletedRecord=null;records=readRecords();$('#history-search').value='';renderHistory();
    $('#history-message').textContent='삭제한 기사를 복원했어요.';$('#records .record-open')?.focus();
  } catch(error) { $('#history-message').textContent=error.message; }
}
function renderRecentRecords() {
  const list = $('#recent-records'); list.replaceChildren();
  $('#recent-message').textContent = storageWarning;
  if (!records.length) {
    const empty = element('div','recent-empty');
    empty.append(element('p','','다시 읽고 싶은 기사를 모아보세요'),element('small','','분석 결과에서 저장할 수 있어요.'));
    list.append(empty); return;
  }
  for (const record of records.slice(0,2)) {
    const open = element('button','recent-entry'); open.type='button'; open.dataset.record=record.id;
    const copy = element('span','recent-copy');
    const date = Date.parse(record.savedAt);
    copy.append(element('strong','',record.analysis.title || record.input.text.slice(0,60) || '이전 분석 결과'),element('small','',Number.isFinite(date) ? new Date(date).toLocaleDateString('ko-KR') : '저장한 기사'));
    open.append(copy);
    const image = normalizeArticleImage(record.analysis.articleImage);
    if (image) {
      const photo=element('img','recent-photo');photo.alt='';photo.width=58;photo.height=64;photo.loading='lazy';photo.referrerPolicy='no-referrer';
      photo.addEventListener('error',()=>photo.remove());photo.src=image.url;open.append(photo);
    }
    list.append(open);
  }
}
function fingerprint(result) { return JSON.stringify({kind: result.kind, input: result.input, analysis: result.analysis}); }
function saveRecord() {
  if (!currentResult) return;
  try {
    // 다른 탭의 저장·삭제도 반영한 뒤 기록한다.
    records = readRecords();
    if (!storageReadable) throw new Error(storageWarning);
    if (records.some(record => fingerprint(record) === fingerprint(currentResult))) {
      show('history'); return;
    }
    const id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
    persistRecords([{...currentResult, id, savedAt: new Date().toISOString()}, ...records]);
    $('#save-message').className = 'helper'; $('#save-message').textContent = '저장한 기사에 담았어요.'; setSaveLabel('저장한 기사 보기');
  } catch (error) { $('#save-message').className = 'helper error'; $('#save-message').textContent = error.message; }
}
function setBusy(busy) {
  $('#article-form').setAttribute('aria-busy', String(busy));
  for (const id of ['article-url', 'article-text', 'url-tab', 'text-tab', 'analyze-button']) $('#' + id).disabled = busy;
  $('#loading').hidden = !busy; $('#cancel-analysis').hidden = !busy;
  $('#analyze-button').textContent = busy ? '분석 중…' : '쟁점과 관점 보기';
}
function formError(message, field) {
  $('#form-message').className = 'helper error'; $('#form-message').textContent = message;
  if (field) field.focus();
}
async function submitArticle(event) {
  event.preventDefault(); if (pendingRequest) return;
  const url=inputMode==='url'?$('#article-url').value.trim():''; const text=inputMode==='text'?$('#article-text').value.trim():'';
  if(!url&&!text){formError(inputMode==='url'?'기사 링크를 입력해 주세요.':'기사 본문을 입력해 주세요.',inputMode==='url'?$('#article-url'):$('#article-text'));return;}
  if(!text&&!safeUrl(url)){formError('http 또는 https로 시작하는 기사 링크를 입력해 주세요.',$('#article-url'));return;}
  if(Array.from(text).length>50000||Array.from(url).length>50000){formError('기사 내용은 50,000자 이내로 입력해 주세요.');return;}
  if(!text&&matchesReviewArticle(url)){openReviewResult({url,text:''});return;}
  const request={controller:new AbortController()}; pendingRequest=request; setBusy(true); $('#form-message').className='helper'; $('#form-message').textContent='';
  try {
    const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,text}),signal:request.controller.signal});
    const data=await response.json(); if(!response.ok) throw new Error(data.error||'분석을 맡기지 못했습니다.');
    $('#form-message').textContent='분석을 맡겼어요. 내 기록에서 진행 상황을 확인할 수 있어요.'; show('history');
  } catch(error){formError(error instanceof TypeError?'로컬 서버 연결을 확인해 주세요.':error.message);}
  finally{pendingRequest=null;setBusy(false);}
}
const jobLabels={queued:'대기 중',running:'분석 중',completed:'완료',failed:'확인 필요',interrupted:'중단됨',cancelled:'취소됨'};
const stageLabels={queued:'대기열',article:'기사 확인',plan_started:'쟁점 설계 중',plan:'쟁점 설계 완료',retrieve:'자료 수집 완료',draft:'입장 초안 완료',review:'근거 검토',completed:'완료',failed:'실패',interrupted:'중단됨',cancelled:'취소됨'};
let jobPoll;
async function loadJobs(){
  try{
    const r=await fetch('/api/jobs?limit=30'); if(!r.ok) throw new Error('기록을 불러오지 못했습니다.'); const data=await r.json(); const root=$('#job-records'); root.replaceChildren();
    for(const job of data.items){
      const row=element('article','record'); const title=element('strong','',job.status==='completed'?(job.title||'완료된 분석'):jobLabels[job.status]||'분석 기록');
      const meta=element('small','',(stageLabels[job.stage]||'분석 진행')+' · '+new Date(job.created_at).toLocaleString('ko-KR')); const copy=element('div','record-copy'); copy.append(title,meta); if(job.error_message) copy.append(element('small','',job.error_message)); row.append(copy);
      if(job.status==='completed'){const open=element('button','text-btn','결과 열기');open.type='button';open.addEventListener('click',async()=>{const d=await fetch('/api/jobs/'+encodeURIComponent(job.id)).then(x=>x.json());if(d.result)renderAnalysis(d.result,{returnScreen:'history'});});row.append(open);}
      else if(job.status==='interrupted'||job.status==='failed'&&job.retryable){const resume=element('button','text-btn','재개');resume.type='button';resume.addEventListener('click',async()=>{await fetch('/api/jobs/'+job.id+'/resume',{method:'POST'});loadJobs();});row.append(resume);}
      else if(job.status==='queued'||job.status==='running'){const cancel=element('button','text-btn','취소');cancel.type='button';cancel.addEventListener('click',async()=>{await fetch('/api/jobs/'+job.id+'/cancel',{method:'POST'});loadJobs();});row.append(cancel);}
      root.append(row);
    }
    clearTimeout(jobPoll); if(data.items.some(j=>j.status==='queued'||j.status==='running')) jobPoll=setTimeout(loadJobs,5000);
  }catch(error){$('#history-message').textContent=error.message;}
}

const reviewParams = new URLSearchParams(location.search);
if (reviewParams.get('review') === 'mbn') $('#article-url').value = REVIEW_ARTICLE_URL;
function restoreScreen(state) {

}

  openReviewResult({url:REVIEW_ARTICLE_URL,text:''});
} else history.replaceState({gray:true,screen:'home'},'',location.href);
